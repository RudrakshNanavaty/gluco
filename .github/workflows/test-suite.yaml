name: "test suite"
on:
  # Exercise every commit pushed to this repository, not only main.
  push: {}
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels its older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  back-end:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: back-end

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        id: install
        run: uv sync --locked

      # Once install succeeds, every check runs even if an earlier one failed.
      - name: Tests
        run: uv run pytest --cov=src/agent --cov-report=term-missing --cov-report=json:coverage/coverage.json --cov-report=html:coverage/html --junitxml=coverage/junit.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-backend
          path: back-end/coverage/
          if-no-files-found: error

      - name: Ruff lint
        if: (success() || failure()) && steps.install.outcome == 'success'
        run: uv run ruff check

      - name: Ruff format
        if: (success() || failure()) && steps.install.outcome == 'success'
        run: uv run ruff format --check

      - name: Type check
        if: (success() || failure()) && steps.install.outcome == 'success'
        run: uv run basedpyright

  # The same adapter contract and panel checks, against the real Tiger database.
  # Reads the "gluco-back-end" environment: connection details are variables, the
  # login is a read-only secret. GitHub withholds secrets from PRs out of forks.
  back-end-live:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: gluco-back-end
    timeout-minutes: 15
    defaults:
      run:
        working-directory: back-end
    env:
      LIVE_DB: "1"
      PGHOST: ${{ vars.PGHOST }}
      PGPORT: ${{ vars.PGPORT }}
      PGDATABASE: ${{ vars.PGDATABASE }}
      PGSSLMODE: ${{ vars.PGSSLMODE }}
      DASHBOARD_SESSION_ID: ${{ vars.DASHBOARD_SESSION_ID }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check the database settings are set
        run: test -n "$PGHOST" -a -n "$PGUSER" -a -n "$PGPASSWORD" || { echo "::error::PGHOST (variable) and PGUSER, PGPASSWORD (secrets) must be set on the gluco-back-end environment"; exit 1; }

      - name: Live database tests
        run: |
          # A secret that was never set arrives empty; unset it so the default applies.
          for v in PGPORT PGDATABASE PGSSLMODE DASHBOARD_SESSION_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          uv run pytest tests/test_postgres_live.py tests/test_window_source.py -rs --junitxml=live.xml

      # A skipped live test would mean nothing was checked against the database.
      - name: No live test was skipped
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse("live.xml").getroot()
          suite = suite.find("testsuite") if suite.tag == "testsuites" else suite
          tests, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          print(f"{tests} tests, {skipped} skipped")
          raise SystemExit(1 if skipped or not tests else 0)
          PY

  front-end:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front-end
    env:
      # A syntactically valid placeholder so the build can prerender; not a real key.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile

      # Once install succeeds, every check runs even if an earlier one failed.
      - name: Tests
        run: bun run test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-frontend
          path: front-end/coverage/
          if-no-files-found: error

      - name: Type check
        if: (success() || failure()) && steps.install.outcome == 'success'
        run: bun run typecheck

      - name: Lint
        if: (success() || failure()) && steps.install.outcome == 'success'
        run: bun run lint

      - name: Build
        if: (success() || failure()) && steps.install.outcome == 'success'
        run: bun run build

  databricks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Verify rolling feature and scoring contracts
        run: uv run --no-project --with-requirements databricks/requirements-test.txt python -m pytest databricks/tests -q --cov=databricks/tiger --cov-report=term-missing --cov-report=json:databricks/coverage/coverage.json --cov-report=html:databricks/coverage/html --junitxml=databricks/coverage/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-databricks
          path: databricks/coverage/
          if-no-files-found: error

  generated-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test documentation generator
        run: python -m unittest scripts/tests/test_generate_reference_docs.py
      - name: Verify generated reference is current
        run: python scripts/generate_reference_docs.py --check

  dependency-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test inventory tooling
        run: python -m unittest scripts/tests/test_dependency_licenses.py
      - name: Verify every resolved dependency has license evidence
        run: python scripts/dependency_licenses.py

  model-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Evaluate synthetic signal against participant-held-out baseline
        run: uv run --no-project --with-requirements databricks/requirements-eval.txt python databricks/tiger/evaluate_m0.py --output /tmp/m0/signal.json
      - name: Verify evaluation rejects a missing signal
        run: |
          set +e
          uv run --no-project --with-requirements databricks/requirements-eval.txt python databricks/tiger/evaluate_m0.py --no-signal --output /tmp/m0/no-signal.json
          status=$?
          set -e
          test "$status" -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-model-evaluation
          path: /tmp/m0/*.json
          if-no-files-found: error

  coverage-report:
    needs: [back-end, front-end, databricks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: /tmp/coverage-input
      - name: Summarize measured reports
        run: |
          python -m unittest discover -s scripts/tests
          mkdir -p /tmp/coverage-input/normalized
          for component in backend frontend databricks; do
            mv "/tmp/coverage-input/coverage-$component" "/tmp/coverage-input/normalized/$component"
          done
          python scripts/coverage_badges.py /tmp/coverage-input/normalized /tmp/coverage-badges
      - uses: actions/upload-artifact@v4
        with:
          name: measured-badges
          path: /tmp/coverage-badges/
          if-no-files-found: error

  publish-coverage-badges:
    needs: coverage-report
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    concurrency:
      group: publish-coverage-badges
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: measured-badges
          path: /tmp/coverage-badges
      - name: Publish generated endpoint data (main only)
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "Newer main exists; leaving its metrics authoritative."
            exit 0
          fi
          if git ls-remote --exit-code --heads origin coverage-badges; then
            git fetch origin coverage-badges
            git checkout -B coverage-badges FETCH_HEAD
          else
            git checkout --orphan coverage-badges
          fi
          git rm -rf --ignore-unmatch .
          cp /tmp/coverage-badges/* .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md backend.json frontend.json databricks.json tests.json
          git commit -m "chore(metrics): publish measured coverage for $GITHUB_SHA"
          git push origin HEAD:coverage-badges

  citation-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Validate software citation schema
        run: uv run --no-project --with cffconvert==2.0.0 cffconvert --validate --infile CITATION.cff
