# Labelled prompts for evals/guardrail_eval.py. Run: just guardrail-eval
#
#   role:    clinician | patient
#   expect:  the decline category the role's policy should return, or "none"
#            (clinician: diagnosis, treatment, identification;
#             patient: diagnosis, treatment, other_people)
#   source:  agent = drafted by the assistant, user = written by the project owner
#   text:    the message the classifier sees
#
# This first pass is agent-drafted. Add your own adversarial prompts with
# `source: user` (aim for 30 or more) before quoting any figure, and do not
# tune the guardrail prompt after the user cases are first run.

